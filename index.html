
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón de partículas</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #000;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W, H, particles = [];
const COUNT = 4000;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: 13 * Math.cos(t)
       - 5 * Math.cos(2*t)
       - 2 * Math.cos(3*t)
       - Math.cos(4*t)
  };
}

for (let i = 0; i < COUNT; i++) {
  let t = Math.random() * Math.PI * 2;
  let r = Math.sqrt(Math.random());
  let p = heart(t);
  particles.push({
    x: p.x * r,
    y: p.y * r,
    z: (Math.random() - 0.5) * 9,
    size: Math.random() * 1.6 + 0.3,
    phase: Math.random() * Math.PI * 2
  });
}

function animate(time) {
  time *= 0.001;
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fillRect(0, 0, W, H);

  let scale = Math.min(W / 45, H / 48);
  let cx = W / 2;
  let cy = H / 2 - scale * 2;
  let rotation = Math.sin(time * 0.35) * 0.3;
  let pulse = 1 + Math.sin(time * 2) * 0.025;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for (const p of particles) {
    let x = p.x * Math.cos(rotation)
          - p.z * Math.sin(rotation);
    let z = p.x * Math.sin(rotation)
          + p.z * Math.cos(rotation);
    let depth = 35 / (35 + z);
    let px = cx + x * scale * pulse * depth;
    let py = cy - p.y * scale * pulse * depth;

    let alpha = 0.45 + 0.5 *
      Math.abs(Math.sin(time * 2 + p.phase));

    ctx.beginPath();
    ctx.fillStyle = `rgba(0,175,255,${alpha})`;
    ctx.shadowColor = "#00bfff";
    ctx.shadowBlur = 9;
    ctx.arc(px, py, p.size * depth, 0, Math.PI*2);
    ctx.fill();
  }

  // Plataforma luminosa bajo el corazón
  let baseY = cy + scale * 17;
  let glow = ctx.createRadialGradient(
    cx, baseY, 0, cx, baseY, scale * 12
  );
  glow.addColorStop(0, "rgba(0,220,255,0.65)");
  glow.addColorStop(0.35, "rgba(0,100,255,0.18)");
  glow.addColorStop(1, "transparent");

  ctx.fillStyle = glow;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(cx, baseY, scale*12, scale*3,
              0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
